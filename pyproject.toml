[project]
name = "cmlive"
version = "0.1.0"
description = "Pipeline em tempo real sobre os autocarros da Carris Metropolitana"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "orjson>=3.10",
    "prometheus-client>=0.26.0",
    "aiokafka[lz4]>=0.11",
]

[project.optional-dependencies]
analytics = ["duckdb>=1.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[project.scripts]
cmlive = "cmlive.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmlive"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: precisa de Postgres/TimescaleDB e Redpanda (docker compose)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/cmlive/report.py" = ["E501"]  # SQL legível > limite de linha
